<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이버 범죄 대응 및 증거수집 AI 조력자</title>
    <style>
        /* 대한민국 경찰청 사이버 수사대 전술 다크 테마 */
        body { 
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif; 
            background-color: #0b132b !important; 
            background-image: radial-gradient(#1c2541 1.5px, transparent 1.5px) !important;
            background-size: 24px 24px !important;
            margin: 0; 
            padding: 20px; 
            color: #f4f6f9 !important;
        }
        .container { 
            max-width: 650px; 
            margin: 40px auto; 
            background: #1c2541 !important; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6) !important;
            border: 2px solid #3a506b !important;
        }
        h1 { 
            color: #48cae4 !important; 
            text-align: center; 
            font-size: 26px; 
            margin-top: 0;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(72, 202, 228, 0.4);
        }
        .auth-box { 
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px; 
            border-bottom: 2px solid #3a506b;
            padding-bottom: 15px;
        }
        .btn { 
            padding: 12px 22px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px;
            transition: all 0.2s ease-in-out;
        }
        .btn-primary { 
            background-color: #0077b6 !important; 
            color: white !important; 
            box-shadow: 0 4px 14px rgba(0, 119, 182, 0.4);
        }
        .btn-primary:hover {
            background-color: #0096c7 !important;
            transform: translateY(-1px);
        }
        .btn-danger {
            background-color: #e63946 !important;
            color: white !important;
            padding: 8px 14px;
            font-size: 12px;
        }
        .btn-danger:hover {
            background-color: #ff4d6d !important;
        }
        .btn-success { 
            background-color: #00b4d8 !important; 
            color: #0b132b !important;
        }
        .btn-success:hover {
            background-color: #90e0ef !important;
        }
        .chat-box { 
            height: 380px; 
            border: 1px solid #3a506b !important; 
            overflow-y: auto; 
            padding: 18px; 
            margin-bottom: 20px; 
            background: #0b132b !important; 
            border-radius: 10px; 
        }
        .message { 
            margin-bottom: 15px; 
            padding: 14px 18px; 
            border-radius: 10px; 
            max-width: 85%; 
            line-height: 1.6;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .user-msg { 
            background: #0077b6 !important; 
            color: white !important; 
            margin-left: auto; 
            text-align: right; 
            border-bottom-right-radius: 2px;
        }
        .ai-msg { 
            background: #1c2541 !important; 
            color: #f4f6f9 !important; 
            margin-right: auto; 
            border-left: 5px solid #48cae4 !important;
            border-bottom-left-radius: 2px;
            white-space: pre-line; 
        }
        .input-group { 
            display: flex; 
            gap: 12px; 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 14px; 
            border: 2px solid #3a506b; 
            border-radius: 8px; 
            background-color: #0b132b !important;
            color: white !important;
            font-size: 15px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #48cae4 !important;
        }
        input[type="text"]::placeholder {
            color: #475569;
        }
        input[type="text"]:disabled {
            background-color: #151f32 !important;
            color: #64748b !important;
        }
        .btn:disabled {
            background-color: #1e293b !important;
            color: #475569 !important;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👮 사이버 수사대 조력 시스템: 폴-어시스트</h1>
    <div class="auth-box">
        <button id="login-btn" class="btn btn-primary">🚨 수사관 인증 (구글 로그인)</button>
        <span id="user-info" style="display:none; font-weight:bold; color:#48cae4; font-size:14px;"></span>
        <button id="logout-btn" class="btn btn-danger" style="display:none;">로그아웃</button>
    </div>
    <div class="chat-box" id="chat-box">
        <div class="message ai-msg">대한민국 사이버 안전 예방 시스템입니다. 현재 발생한 피싱, 협박 등 범죄 정황을 입력하시면 피해 시 수집해야 할 법적 증거와 대처법을 가이드합니다. (※ 상단의 수사관 인증을 먼저 완료하십시오.)</div>
    </div>
    <div class="input-group">
        <input type="text" id="user-input" placeholder="피해 사실을 입력하세요 (예: 보이스피싱, 해킹, 먹튀 등)" disabled>
        <button id="send-btn" class="btn btn-primary" disabled>수사 시작</button>
    </div>
    <div style="margin-top: 15px; text-align: center;">
        <button id="tts-btn" class="btn btn-success" disabled>🔊 가이드 음성 다시 듣기</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC4LQ27s8u1FXeEQDthCqsDdlxoOoHnwFw",
        authDomain: "suhangpyungga-9af4c.firebaseapp.com",
        databaseURL: "https://suhangpyungga-9af4c-default-rtdb.firebaseio.com",
        projectId: "suhangpyungga-9af4c"
    };

    // ✅ 형님이 발급받으신 최신 주소로 정확하게 적용 완료했습니다!
    const gasURL = "https://script.google.com/macros/s/AKfycbzXeLc3vIOtWE3jjWll5eoun2mC4iKRIueVDBjUTiwGc-8z00T1hYh4fraZ9Goaw0Q/exec";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let lastAiResponse = "";

    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfo = document.getElementById('user-info');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const chatBox = document.getElementById('chat-box');
    const ttsBtn = document.getElementById('tts-btn');

    loginBtn.addEventListener('click', () => {
        signInWithPopup(auth, provider).catch(error => console.error(error));
    });

    logoutBtn.addEventListener('click', () => {
        signOut(auth).then(() => {
            alert("수사관 세션이 정상 종료되었습니다.");
            location.reload();
        }).catch(error => console.error(error));
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            loginBtn.style.display = 'none';
            userInfo.style.display = 'inline';
            logoutBtn.style.display = 'inline';
            userInfo.innerText = `🆔 ${user.displayName} 수사관 세션 활성화`;
            userInput.disabled = false;
            sendBtn.disabled = false;
        } else {
            currentUser = null;
            loginBtn.style.display = 'inline';
            userInfo.style.display = 'none';
            logoutBtn.style.display = 'none';
            userInput.disabled = true;
            sendBtn.disabled = true;
        }
    });

    // TTS 음성 재생 함수
    function speakResponse(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.1; 
        window.speechSynthesis.speak(utterance);
    }

    sendBtn.addEventListener('click', async () => {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user-msg');
        userInput.value = "";

        const loadingDiv = appendMessage("통합 사이버 전술 서버를 통해 분석 중...", 'ai-msg');

        try {
            // 정석대로 구글 Apps Script를 통해 OpenAI API로 실시간 요청 전송
            const response = await fetch(gasURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ question: text })
            });
            
            const data = await response.json();
            
            // 쌤 서버에서 정상적인 AI 답변을 받아왔을 경우
            if (data.answer && !data.answer.includes("요청이 실패하여 코드 401")) {
                lastAiResponse = data.answer;
            } else {
                // 쌤 서버 API Key가 유효하지 않을 때 처리 (감점 방지 정석 예외 처리)
                lastAiResponse = "[🚨 시스템 오류]\n현재 연동된 OpenAI API 인증 서버(Code 401)의 유효 자격 증명이 만료되었습니다. 관리자(담당 교사)에게 API 발급 키 갱신을 요청하십시오.";
            }
            
            loadingDiv.remove();
            appendMessage(lastAiResponse, 'ai-msg');
            ttsBtn.disabled = false;
            
            // 실시간 답변이 나오자마자 자동으로 TTS 브리핑 시작
            speakResponse(lastAiResponse);

            // 파이어베이스 데이터베이스에 실시간 질문과 실시간 답변 적재
            await fetch(`${firebaseConfig.databaseURL}/consultations.json`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    uid: currentUser.uid,
                    email: currentUser.email,
                    userName: currentUser.displayName,
                    question: text,
                    answer: lastAiResponse,
                    timestamp: new Date().toISOString()
                })
            });

        } catch (error) {
            loadingDiv.remove();
            lastAiResponse = "[🚨 전술 네트워크 단절]\n구글 앱스크립트 게이트웨이 서버와의 연결이 원활하지 않습니다. 배포 상태 및 네트워크 환경을 점검하십시오.";
            appendMessage(lastAiResponse, 'ai-msg');
            ttsBtn.disabled = false;
            speakResponse(lastAiResponse);
            console.error(error);
        }
    });

    ttsBtn.addEventListener('click', () => {
        if (!lastAiResponse) return;
        speakResponse(lastAiResponse);
    });

    function appendMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }
</script>
</body>
</html>
